<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">Know It for YouTube</title>
  <desc id="desc">Get the answer a clickbait headline is hiding, without watching the video.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a201c" />
      <stop offset="1" stop-color="#191412" />
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd166" />
      <stop offset="1" stop-color="#ff7a59" />
    </linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff7a59" stop-opacity="0.22" />
      <stop offset="1" stop-color="#ff7a59" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="1280" height="320" rx="24" fill="url(#bg)" />
  <rect width="1280" height="320" rx="24" fill="url(#glow)" />

  <g transform="translate(150 160) scale(8.5) translate(-12 -11)">
    <path fill="url(#spark)" d="M9.5 4 11 9.5 16.5 11 11 12.5 9.5 18 8 12.5 2.5 11 8 9.5Z" />
    <path fill="url(#spark)" d="M18 2 18.8 5.2 22 6 18.8 6.8 18 10 17.2 6.8 14 6 17.2 5.2Z" />
    <path fill="url(#spark)" d="M18 14.5 18.6 16.9 21 17.5 18.6 18.1 18 20.5 17.4 18.1 15 17.5 17.4 16.9Z" />
  </g>

  <g font-family="Roboto, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
    <text x="300" y="150" fill="#f4ede6" font-size="76" font-weight="700" letter-spacing="-1">Know It <tspan fill="#b3a69b" font-weight="400">for YouTube</tspan></text>
    <text x="302" y="206" fill="#d9cdc2" font-size="30">The answer a clickbait headline is hiding, without watching.</text>
    <g transform="translate(302 236)">
      <rect width="196" height="40" rx="20" fill="#3a2a0c" stroke="#ffb547" stroke-width="2" />
      <text x="98" y="27" fill="#ffd166" font-size="19" font-weight="600" text-anchor="middle">✦ Know it</text>
      <text x="222" y="27" fill="#b3a69b" font-size="20">Free · your own Gemini key · Chrome</text>
    </g>
  </g>
</svg>
